services:
  front-desk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5-5}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY_ENV: ${LLM_API_KEY_ENV:-}
      LLM_MODE: ${LLM_MODE:-auto}
      LLM_OUTPUT_MODE: ${LLM_OUTPUT_MODE:-schema}
      DESK_CONFIG: /app/desk/business.json
    volumes:
      - front-desk-data:/app/data
      - ./desk/business.json:/app/desk/business.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  front-desk-data:
