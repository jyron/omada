services:
  front-desk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DESK_CONFIG: /app/desk/business.json
    volumes:
      - front-desk-data:/app/data
      - ./desk/business.json:/app/desk/business.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  front-desk-data:
